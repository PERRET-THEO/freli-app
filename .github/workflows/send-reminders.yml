name: Relances automatiques

# Déclenchement MANUEL des batchs de relances (dépannage).
# Les relances tournent toutes les heures via pg_cron côté Supabase
# (migration 202611111010_reminder_crons_hourly.sql) :
#   :05 smart-reminders-batch, :35 send-reminders-batch.
# Plus de planification GitHub (passes en retard / doublons de génération IA).

on:
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le batch de relances
        run: |
          HTTP_CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            -X POST "${SUPABASE_PROJECT_URL}/functions/v1/send-reminders-batch" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Réponse ($HTTP_CODE):"
          cat /tmp/body.txt
          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "Echec du batch de relances (HTTP $HTTP_CODE)"
            exit 1
          fi
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Déclencher le batch de relances intelligentes (IA)
        run: |
          HTTP_CODE=$(curl -s -o /tmp/smart.txt -w "%{http_code}" \
            -X POST "${SUPABASE_PROJECT_URL}/functions/v1/smart-reminders-batch" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Réponse ($HTTP_CODE):"
          cat /tmp/smart.txt
          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "Echec du batch de relances intelligentes (HTTP $HTTP_CODE)"
            exit 1
          fi
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
